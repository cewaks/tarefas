name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install
      - name: Preparar app
        run: |
          mkdir -p www assets
          cp index.html sync.js config.js manifest.webmanifest icon-192.png icon-512.png www/
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
          cp node_modules/jszip/dist/jszip.min.js www/jszip.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js#supabase.js#; s#https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js#jszip.min.js#' www/index.html
          cp icon-only.png icon-foreground.png icon-background.png assets/
      - name: Criar projeto Android
        run: npx cap add android
      - name: Gerar icones
        run: npx capacitor-assets generate --android
      - name: Permissoes de notificacao
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><application#' android/app/src/main/AndroidManifest.xml
      - name: Sincronizar
        run: npx cap sync android
      - name: Chave de assinatura fixa
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Compilar APK
        run: cd android && ./gradlew assembleDebug
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tarefas v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
