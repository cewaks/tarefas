<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Tarefas</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tarefas"><meta name="theme-color" content="#2f6f5e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1d1d1b;--mu:#77756e;--ac:#2f6f5e;--bd:#e3e0d8;--r:#c0392b;--y:#b7791f;--g:#2f7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151614;--cd:#20221f;--tx:#eeede8;--mu:#9a988f;--ac:#4fa58c;--bd:#33352f;--r:#e5675a;--y:#e0a94a;--g:#5cb884}}
:root[data-theme="dark"]{--bg:#151614;--cd:#20221f;--tx:#eeede8;--mu:#9a988f;--ac:#4fa58c;--bd:#33352f;--r:#e5675a;--y:#e0a94a;--g:#5cb884}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
header span{display:flex;gap:6px}header button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:6px 9px;font:inherit}
main{padding:10px 14px 150px;font-size:calc(15px*var(--z,1))}h4{margin:16px 0 6px}h3{margin:0 0 10px}.mu{color:var(--mu);font-size:.87em;margin:2px 0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:calc(10px*var(--z,1)) calc(12px*var(--z,1));margin:8px 0;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.card.dn{opacity:.55}.p2{border-left:4px solid var(--r)}
.tt{font-weight:600}.ch{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}.c{font-size:.8em;border:1px solid var(--bd);border-radius:20px;padding:1px 8px;color:var(--mu)}
.cr{color:var(--r);border-color:var(--r)}.cy{color:var(--y);border-color:var(--y)}.cg{color:var(--g);border-color:var(--g)}
.nx{font-size:.93em;margin:4px 0}.nx.w{color:var(--y)}.wt{background:var(--bg);border-radius:8px;padding:8px;margin:6px 0;font-size:.93em}
.pg{height:5px;background:var(--bd);border-radius:5px;margin:8px 0}.pg i{display:block;height:100%;background:var(--ac);border-radius:5px}
.ck{display:flex;gap:8px;align-items:center;margin:4px 0}.ck input{width:auto;margin:0}
.ac{display:flex;gap:6px;margin-top:8px}.ac>*{flex:1;border:1px solid var(--bd);background:none;border-radius:8px;padding:6px 0;text-align:center;text-decoration:none;color:var(--tx);font:inherit}
.b{display:block;width:100%;text-align:center;border:0;border-radius:10px;padding:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;text-decoration:none;margin:4px 0}.b.g{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.b.d{background:var(--r)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r3{display:flex;gap:6px;margin-top:6px}.r3>*{flex:1;margin:0}
.bd{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.col{min-width:min(88%,calc(80%*var(--z,1)));min-height:240px}.col.mini{display:inline-block;min-width:0;min-height:0;margin:0 0 6px;padding:5px 14px;border:1px dashed var(--bd);border-radius:20px;cursor:pointer;color:var(--mu);background:var(--cd)}.hb{border:1px solid var(--bd);background:var(--cd);color:var(--mu);border-radius:8px;padding:2px 8px;font:inherit;font-size:.8em;margin-left:6px}.col.ov{outline:2px dashed var(--ac);outline-offset:2px;border-radius:12px}.zm{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:6px;color:var(--mu)}.zm button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:4px 12px;font:inherit}.ev{display:flex;gap:8px;align-items:flex-start}.ev>b{min-width:54px;font-size:.8em;color:var(--mu);padding-top:14px}.ev>.card{flex:1}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0}input,select,textarea{display:block;width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:3px}textarea{min-height:60px}
.mb{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}.md{background:var(--cd);width:100%;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;overscroll-behavior:contain;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}.card{position:relative}.card.sel{outline:2px solid var(--ac);box-shadow:0 0 0 4px #2f6f5e44}.sk{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:2px solid var(--mu);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}.sel .sk{background:var(--ac);border-color:var(--ac);color:#fff}.selm .tt{padding-right:30px}.selm .card button:not(.vb),.selm .card a,.selm .card label,.selm .card input{pointer-events:none}.sbar{align-items:center;gap:8px;padding:10px}.sbar{flex-wrap:wrap}.sbar span{flex:1 1 100%;font-size:13px}.sbar .b{flex:1;width:auto;margin:0;padding:10px 14px}details.rd{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:8px 0}details.rd summary{cursor:pointer}details.rd input{display:inline-block;width:auto;margin:0 8px 0 0}.rb{margin-top:8px;font-size:.93em;display:grid;gap:4px}.rt{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin:8px 0}.rt summary{cursor:pointer}.rcb{display:block;width:24px;height:24px;margin:0;flex:none}.rr .r3{align-items:center;gap:12px}.dw{display:flex;gap:4px;margin:8px 0}.dl{flex:1;text-align:center;margin:0;border:1px solid var(--bd);border-radius:8px;padding:6px 0;font-size:12px;color:var(--tx)}.dl input{display:block;margin:0 auto 4px;width:auto}.hn{width:42px;height:4px;border-radius:2px;background:var(--bd);margin:-6px auto 12px}.lg{font-size:12px;color:var(--mu);margin:8px 0}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{display:flex;gap:6px;padding:8px 10px}.bar input{margin:0}.bar button{border:1px solid var(--bd);background:var(--cd);border-radius:8px;padding:0 12px;font-size:18px;color:var(--tx)}.bar button.on{background:var(--r)}
nav{display:flex}nav button{flex:1;border:0;background:none;padding:10px 0;font:inherit;font-size:12px;white-space:nowrap;color:var(--mu)}nav button.on{color:var(--ac);font-weight:700}
#tt{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;opacity:0;transition:.2s;z-index:30;pointer-events:none;font-size:14px;max-width:90%}#tt.on{opacity:1;pointer-events:auto}
</style></head><body>
<header><b>✅ Tarefas</b><span><button id="me" onclick="S.me=S.me==='eu'?'ela':'eu';render()"></button><button onclick="imp()">⤓</button><button onclick="bell()">🔔</button><button onclick="tp()">＋ Modelo</button></span></header>
<main id="app"></main><div id="m"></div><div id="tt"></div>
<footer><div id="sb" class="sbar" style="display:none"></div><div class="bar"><input id="q" placeholder="Anotar rápido ou falar…" onkeydown="if(event.key==='Enter')add()"><button id="mb" onclick="mic()">🎤</button><button onclick="add()">＋</button></div>
<nav><button data-v="hoje" onclick="go('hoje')">🎯 Hoje</button><button data-v="quadro" onclick="go('quadro')">🗂 Quadro</button><button data-v="agenda" onclick="go('agenda')">📅 Agenda</button><button data-v="depois" onclick="go('depois')">⏳ Mais tarde</button><button data-v="rotinas" onclick="go('rotinas')">🔁 Rotinas</button></nav></footer>
<script>
const $=s=>document.querySelector(s),ymd=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
td=()=>ymd(),ad=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)},
dd=(a,b)=>Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5),
esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
uid=()=>Math.random().toString(36).slice(2,9);
const ST=[['ideia','Ideia'],['fazer','A fazer'],['fazendo','Fazendo'],['aguardando','Aguardando'],['feito','Feito']],WHO={eu:'Eu',ela:'Esposa',nos:'Nós'};
function mk(o){return Object.assign({id:uid(),t:'',st:'fazer',pri:1,due:'',tm:'',who:'eu',priv:false,c:'eu',next:'',wn:'',ph:'',ch:'',subs:[],nt:'',log:[],min:0,foc:false,rec:'',per:0,ant:14,lt:false,up:td()},o)}
function seed(){const t=td();return[
mk({t:'Consertar vazamento da pia',st:'aguardando',next:'Ligar para o João e cobrar a visita',wn:'João (encanador)',ph:'11999990000',ch:t,due:ad(t,3),up:ad(t,-6),pri:2}),
mk({t:'Renovar seguro do carro',next:'Pedir 3 cotações',due:t,foc:true,min:5,subs:[{t:'Cotação 1',d:1},{t:'Cotação 2',d:0}]}),
mk({t:'Reunião de pais na escola',due:ad(t,1),tm:'19:00',who:'nos'}),
mk({t:'Presente de aniversário (surpresa)',st:'ideia',priv:true})]}
let S;try{S=JSON.parse(localStorage.getItem('tf1'))}catch(e){}
S=S||{tasks:seed(),view:'hoje',me:'eu',five:false,sk:{n:0,l:''},nt:{},wk:0};S.z=S.z||1;S.rot=S.rot||[];
const save=()=>{try{localStorage.setItem('tf1',JSON.stringify(S))}catch(e){}if(window.onSave)window.onSave()},
T=id=>S.tasks.find(t=>t.id===id),V=()=>S.tasks.filter(t=>(!t.priv||t.c===S.me)&&!t.lt),
go=v=>{S.view=v;render()};
let tmr;function toast(m,a){const e=$('#tt');e.innerHTML=esc(m)+(a?' <u onclick="undo()" style="cursor:pointer;margin-left:10px;font-weight:700">Desfazer</u>':'');e.className='on';clearTimeout(tmr);tmr=setTimeout(()=>e.className='',a?7000:2600)}
let P=[];
let H=0,HB=0;
function modal(h){if(!H){try{history.pushState({m:1},'');H=1}catch(e){}}$('#m').innerHTML=`<div class="mb" onclick="if(event.target===this)cl()"><div class="md"><div class="hn"></div>${h}</div></div>`}
function cl(){$('#m').innerHTML='';setTimeout(hx,0)}
function hx(){if(H&&!$('#m').innerHTML){H=0;HB++;setTimeout(()=>{HB=0},700);try{history.back()}catch(e){HB=0}}}
window.addEventListener('popstate',()=>{if(HB>0){HB--;return}if(H){H=0;$('#m').innerHTML=''}});
let Y=null;
document.addEventListener('touchstart',e=>{const m=e.target.closest('.md');if(!m||e.target.closest('input,textarea,select')){Y=null;return}Y={m,y:e.touches[0].clientY,d:0,ok:m.scrollTop<=0}},{passive:true});
document.addEventListener('touchmove',e=>{if(!Y||!Y.ok)return;const d=e.touches[0].clientY-Y.y;if(d<=0){Y.d=0;Y.m.style.transform='';return}if(e.cancelable)e.preventDefault();Y.d=d;Y.m.style.transition='none';Y.m.style.transform=`translateY(${d}px)`},{passive:false});
document.addEventListener('touchend',()=>{if(!Y)return;const y=Y;Y=null;if(!y.d)return;y.m.style.transition='transform .2s';if(y.d>90){y.m.style.transform='translateY(100%)';setTimeout(cl,160)}else y.m.style.transform=''});
function pick(t,o){P=o;modal(`<h3>${t}</h3>`+o.map((x,i)=>`<button class="b g" onclick="P[${i}][1]()">${x[0]}</button>`).join(''))}
function lg(t,m){t.log.push({d:td(),m});t.up=td()}
function gc(t){const a=t.due.replace(/-/g,'');let d;if(t.tm){const h=+t.tm.slice(0,2);d=a+'T'+t.tm.replace(':','')+'00/'+a+'T'+String(Math.min(h+1,23)).padStart(2,'0')+t.tm.slice(3)+'00'}else d=a+'/'+ad(t.due,1).replace(/-/g,'');return'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.t)+'&dates='+d+'&details='+encodeURIComponent(t.next||t.nt)}
function card(t,b){const dn=t.st==='feito',age=dd(td(),t.up),ac=age>=7?'cr':age>=3?'cy':'cg',sd=t.subs.filter(s=>s.d).length,w=t.st==='aguardando',dg=(t.ph||'').replace(/\D/g,''),wa=dg.length<=11?'55'+dg:dg;
return`<div class="card${dn?' dn':''} p${t.pri}${SEL.has(t.id)?' sel':''}" data-id="${t.id}">${SEL.size?'<span class="sk">✓</span>':''}<div class="tt">${t.foc?'⭐ ':''}${esc(t.t)}</div><div class="ch">${t.due?`<span class="c${t.due<td()&&!dn?' cr':''}">📅 ${t.due.slice(8)}/${t.due.slice(5,7)}${t.tm?' '+t.tm:''}</span>`:''}<span class="c">${t.who==='nos'?'👫':t.who==='ela'?'👩':'👤'} ${WHO[t.who]}</span>${t.priv?'<span class="c">🔒</span>':''}${t.min?`<span class="c">⏱ ${t.min}min</span>`:''}${!dn&&age>0?`<span class="c ${ac}">${age}d parada</span>`:''}</div>`
+(dn?'':t.next?`<div class="nx">➡️ ${esc(t.next)}</div>`:'')
+(w?`<div class="wt">⏳ ${esc(t.wn||'alguém')}${t.ch?' · cobrar '+t.ch.slice(8)+'/'+t.ch.slice(5,7):''}<div class="r3">${dg?`<a class="b g" href="tel:${dg}">📞 Ligar</a><a class="b g" target="_blank" href="https://wa.me/${wa}">💬 Zap</a>`:''}<button class="b" onclick="cb('${t.id}')">Cobrei</button></div></div>`:'')
+(t.subs.length?`<div class="pg"><i style="width:${sd/t.subs.length*100}%"></i></div>`+t.subs.map((s,i)=>`<label class="ck"><input type="checkbox"${s.d?' checked':''} onchange="sub('${t.id}',${i})"> ${esc(s.t)}</label>`).join(''):'')
+(SEL.size?'<div class="ac"><button class="vb">👁 Ver detalhes</button></div>':`<div class="ac"><button onclick="fin('${t.id}')">${dn?'↩':'✓'}</button><button onclick="fc('${t.id}')">⭐</button><button onclick="sn('${t.id}')">💤</button><button onclick="hp('${t.id}')">🤝</button>${t.due?`<a href="${gc(t)}" target="_blank">🗓</a>`:''}<button onclick="edit('${t.id}')">✏️</button>${b?`<button onclick="mv('${t.id}',-1)">◀</button><button onclick="mv('${t.id}',1)">▶</button>`:''}</div>`)+'</div>'}
function sub(id,i){const t=T(id);t.subs[i].d^=1;t.up=td();render()}
function fc(id){const t=T(id);t.foc=!t.foc;render()}
function mv(id,d){const t=T(id),i=ST.findIndex(s=>s[0]===t.st)+d;if(i<0||i>4)return;t.st=ST[i][0];lg(t,'→ '+ST[i][1]);render()}
let U=null;
function undo(){if(!U)return;if(U.bulk){S.tasks.push(...U.bulk);U=null;toast('Desfeito');render();return}Object.assign(T(U.id),JSON.parse(U.s));S.sk=U.sk;if(U.nid)S.tasks=S.tasks.filter(x=>x.id!==U.nid);U=null;toast('Desfeito');render()}
function fin(id){const t=T(id);if(t.st==='feito'){t.st='fazer';lg(t,'Reaberta')}else{U={id,s:JSON.stringify(t),sk:{...S.sk},nid:null};t.st='feito';t.foc=false;lg(t,'Concluída');
if(S.sk.l!==td()){S.sk.n=S.sk.l===ad(td(),-1)?S.sk.n+1:1;S.sk.l=td()}
if(t.per){const n=mk({...t,id:uid(),st:'fazer',lt:true,log:[],subs:t.subs.map(s=>({t:s.t,d:0})),due:addm(td(),t.per),up:td(),foc:false});S.tasks.push(n);U.nid=n.id}toast('Feito! 🎉'+(U.nid?' Volta no Mais tarde.':''),1)}render()}
function sn(id){const t=T(id),s=(d,tm)=>()=>{t.due=d;if(tm)t.tm=tm;lg(t,'Adiada para '+d);cl();render()},sat=ad(td(),(6-new Date().getDay()+7)%7||7);
pick('Adiar para…',[['🌙 Hoje à noite',s(td(),'20:00')],['☀️ Amanhã',s(ad(td(),1))],['🏖 Fim de semana',s(sat)]])}
function cb(id){const t=T(id),s=n=>()=>{t.ch=ad(td(),n);lg(t,'Cobrou '+t.wn+'. Nova cobrança: '+t.ch);cl();render()};pick('Cobrei! Cobrar de novo em…',[['Amanhã',s(1)],['3 dias',s(3)],['1 semana',s(7)]])}
function hp(id){const o=S.me==='eu'?'ela':'eu';modal(`<h3>🤝 Pedir ajuda a ${WHO[o]}</h3><label>Comentário<textarea id="hc"></textarea></label><button class="b" onclick="hg('${id}','${o}')">Enviar</button>`)}
function hg(id,o){const t=T(id);t.who=o;t.priv=false;lg(t,'Pedido a '+WHO[o]+': '+$('#hc').value);cl();render()}
function fd(){const L=V().filter(t=>t.st!=='feito'&&t.st!=='aguardando');modal(`<h3>🌙 Fechar o dia</h3><p class="mu">Escolha as tarefas de foco para amanhã.</p><div class="pl">${L.map(t=>`<label class="ck"><input type="checkbox" value="${t.id}"${t.foc?' checked':''}> ${esc(t.t)}</label>`).join('')||'Nada pendente 🎉'}</div><button class="b" onclick="fg()">Pronto</button>`)}
function fg(){const c=[...document.querySelectorAll('.pl input')].filter(x=>x.checked).map(x=>x.value);V().forEach(t=>{if(c.includes(t.id)){t.foc=true;if(!t.due||t.due<=td())t.due=ad(td(),1)}else if(t.st!=='aguardando')t.foc=false});cl();render()}
function tp(){pick('Modelo',[['🔧 Contratar prestador',()=>{cl();edit(null,{t:'Contratar ',subs:['Pedir orçamentos','Comparar','Agendar','Pagar','Avaliar'].map(x=>({t:x,d:0}))})}],['💳 Conta do mês',()=>{cl();edit(null,{t:'Pagar ',rec:'m',due:td(),subs:[{t:'Conferir valor',d:0},{t:'Pagar',d:0}]})}],['Em branco',()=>{cl();edit()}]])}
function edit(id,pre){const t=id?T(id):mk({c:S.me,...pre});window._t=t;
const o=(a,v)=>a.map(([k,l])=>`<option value="${k}"${k==v?' selected':''}>${l}</option>`).join(''),i=(k,l,ty)=>`<label>${l}<input id="f${k}" type="${ty||'text'}" value="${esc(t[k]||'')}"></label>`;
modal(`<h3>${id?'Editar':'Nova'} tarefa</h3>${i('t','Título')}${i('next','Próxima ação (passo físico, ex.: ligar para…)')}
<div class="r2"><label>Etapa<select id="fst">${o(ST.concat([['depois','Mais tarde']]),t.lt?'depois':t.st)}</select></label><label>Prioridade<select id="fpri">${o([[0,'Pode esperar'],[1,'Importante'],[2,'Urgente']],t.pri)}</select></label></div>
<div class="r2"><label>Responsável<select id="fwho">${o(Object.entries(WHO),t.who)}</select></label><label>Ao concluir, voltar em<select id="fper">${o([[0,'Não repetir'],[1,'1 mês'],[3,'3 meses'],[6,'6 meses'],[12,'1 ano'],[24,'2 anos']],t.per||0)}</select></label></div>
<label class="ck"><input id="fpv" type="checkbox"${t.priv?' checked':''}> 🔒 Só eu posso ver</label>
<div class="r2">${i('due','Data','date')}${i('tm','Hora','time')}</div><div class="r2"><label>Outro prazo (meses)<input id="fper2" type="number" min="1" value="${t.per&&![1,3,6,12,24].includes(t.per)?t.per:''}"></label>${i('ant','Voltar quantos dias antes?','number')}</div>${i('min','Minutos estimados','number')}
<div class="r2">${i('wn','Aguardando quem?')}${i('ph','Telefone','tel')}</div>${i('ch','Cobrar em','date')}
<label>Subtarefas (uma por linha)<textarea id="fsb">${esc(t.subs.map(s=>s.t).join('\n'))}</textarea></label>
<label>Anotações<textarea id="fnt">${esc(t.nt)}</textarea></label>
${t.log.length?`<div class="lg">${t.log.slice(-4).map(l=>l.d+': '+esc(l.m)).join('<br>')}</div>`:''}
