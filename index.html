<title>כוכבי היום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&display=swap">
<style>
/* Layout: one-column phone app; big touch cards; kid colour flows through --kid */
:root{
  --bg:#E9F3F1; --surface:#FFFFFF; --surface-2:#F3F9F8; --ink:#15313A; --muted:#58767E;
  --line:#D2E4E0; --star:#F2B21B; --star-soft:#FCEFC8; --good:#1D9A67; --good-soft:#DDF3E9;
  --danger:#C8453B; --shadow:0 2px 0 rgba(21,49,58,.08), 0 6px 18px rgba(21,49,58,.06);
  --kid:#2E86C1; --kid-soft:#E2EEF8;
  --f-display:'Secular One','Varela Round',system-ui,sans-serif;
  --f-body:'Varela Round',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1D22; --surface:#16292F; --surface-2:#1C333A; --ink:#E5F1EF; --muted:#94B1B7;
  --line:#2A454C; --star:#F6C443; --star-soft:#3A3320; --good:#3DC48B; --good-soft:#173A2D;
  --danger:#F07166; --shadow:0 2px 0 rgba(0,0,0,.25); --kid-soft:#1F3440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1D22; --surface:#16292F; --surface-2:#1C333A; --ink:#E5F1EF; --muted:#94B1B7;
  --line:#2A454C; --star:#F6C443; --star-soft:#3A3320; --good:#3DC48B; --good-soft:#173A2D;
  --danger:#F07166; --shadow:0 2px 0 rgba(0,0,0,.25); --kid-soft:#1F3440; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.15} h2{font-size:22px} h3{font-size:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--kid);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line);font-size:16px}
.btn.primary{background:var(--kid);border-color:var(--kid);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-size:15px}
.chip[aria-pressed="true"]{background:var(--kid);border-color:var(--kid);color:#fff}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{font-size:30px}
.date{font-size:15px;color:var(--muted)}

/* profiles */
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.profile{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;border:3px solid transparent;transition:transform .15s}
.profile:active{transform:scale(.97)}
.profile .pm{font-size:64px;line-height:1;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:var(--kid-soft)}
.profile .pn{font-family:var(--f-display);font-size:22px}
.profile .ps{font-size:14px;color:var(--muted)}
.parentlink{align-self:center;color:var(--muted);font-size:15px;min-height:44px;padding:0 14px}

/* pin */
.pinwrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:10px}
.pinwho{font-size:64px}
.dots{display:flex;gap:16px;direction:ltr}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--kid)}
.dot.on{background:var(--kid)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr}
.key{height:76px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:30px;font-family:var(--f-display)}
.key:active{background:var(--kid-soft)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* kid header */
.hero{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.mascot{font-size:62px;width:92px;height:92px;border-radius:50%;background:var(--kid-soft);display:grid;place-items:center;line-height:1}
.mascot{position:relative}.mascot.bounce{animation:bounce .7s}.mascot.spin{animation:spin .8s}.mascot.wig{animation:wig .6s}
@keyframes spin{to{transform:rotate(360deg) scale(1.1)}}@keyframes wig{20%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
.acc{position:absolute;font-size:26px;font-style:normal}.acc.a1{top:-14px;left:50%;transform:translateX(-50%)}.acc.a2{bottom:8px;right:2px;font-size:22px}.acc.a3{top:2px;left:0;font-size:22px}
.petn{border:0;background:none;font:inherit;font-size:14px;color:var(--muted);padding:0;text-align:start}.bub{background:var(--kid-soft);border-radius:14px;padding:6px 10px;font-size:14px;margin-top:4px}
.coll .sg{display:flex;flex-wrap:wrap;gap:8px;font-size:30px}.coll .lock{opacity:.25}.coll h3{margin:0}.coll .lbl{font-size:13px;color:var(--muted)}
@keyframes bounce{30%{transform:translateY(-14px) scale(1.08)}60%{transform:translateY(0) scale(.96)}}
.hero .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.lvl{font-size:14px;color:var(--muted)}
.bar{height:12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--kid);border-radius:99px;transition:width .6s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.stat .lbl{font-size:13px;color:var(--muted)}
.stars{display:flex;gap:4px;justify-content:space-between}
.st{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);gap:2px}
.st b{font-size:22px;line-height:1;filter:grayscale(1) opacity(.35)}
.st.on b{filter:none}
.st.today{color:var(--ink);font-weight:bold}
.money{font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}

/* next task */
.next{background:var(--kid);color:#fff;border-radius:26px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);text-align:start;width:100%}
.next .ne{font-size:52px;line-height:1}
.next .nl{font-size:14px;opacity:.85}
.next .nt{font-family:var(--f-display);font-size:24px;line-height:1.2}
.alldone{background:var(--good-soft);border-radius:26px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:4px}
.alldone .big{font-size:48px}

/* tasks */
.school{text-align:center;font-size:22px;font-weight:800;padding:16px 10px;border-radius:var(--r);background:var(--kid-soft);border:3px dashed var(--muted);margin:6px 0}
.period{display:flex;flex-direction:column;gap:10px}
.phead{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:16px}
.phead .pe{font-size:22px}
.task{display:flex;align-items:stretch;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:3px solid transparent;overflow:hidden;transition:background .2s,border-color .2s}
.task.isnext{border-color:var(--kid)}
.task.done{background:var(--good-soft)}
.tmain{flex:1;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:start;min-height:78px;min-width:0}
.temoji{font-size:40px;line-height:1;width:52px;text-align:center;flex:none}
.tbody{flex:1;display:flex;flex-direction:column;min-width:0}
.ttitle{font-size:20px;line-height:1.25}
.task.done .ttitle{text-decoration:line-through;text-decoration-color:var(--good);text-decoration-thickness:3px;color:var(--muted)}
.tmeta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.check{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;font-size:24px;color:transparent;transition:all .2s}
.task.done .check{background:var(--good);border-color:var(--good);color:#fff;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.ttimer{flex:none;width:62px;border-inline-start:2px solid var(--line);font-size:26px;background:var(--surface-2)}
.empty{text-align:center;padding:30px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .big{font-size:64px}

/* reminders + mood */
.remind{background:var(--star-soft);border:2px solid var(--star);border-radius:18px;padding:12px 16px;font-size:17px}
.remind.sleep,.remind.soon{background:var(--kid-soft);border-color:var(--kid)}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moodbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;background:var(--surface-2);border:2px solid var(--line);font-size:14px}
.moodbtn span{font-size:38px;line-height:1.1}
.moodbtn[aria-pressed="true"]{border-color:var(--kid);background:var(--kid-soft)}
.moodchip{align-self:flex-start;background:var(--surface);border-radius:999px;padding:6px 16px;box-shadow:var(--shadow);font-size:15px;color:var(--muted);min-height:44px}
/* overlays */
[hidden]{display:none!important}
#overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,25,30,.55);padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:26px;padding:22px;width:100%;max-width:440px;max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal.center{text-align:center;align-items:center}
.cele .big{font-size:88px;line-height:1;animation:pop .6s}
.praise{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:60;background:var(--surface);color:var(--ink);border:4px solid var(--good);border-radius:26px;padding:14px 26px;font-family:var(--f-display);font-size:30px;box-shadow:0 10px 30px rgba(0,0,0,.2);pointer-events:none;animation:praise 1.3s forwards;white-space:nowrap}
@keyframes praise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:80;max-width:calc(100% - 32px);font-size:15px}

/* timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:16px}
.ring{position:relative;width:250px;height:250px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring .te{font-size:54px;line-height:1}
.ring .tt{font-family:var(--f-display);font-size:44px;direction:ltr;font-variant-numeric:tabular-nums}

/* parent */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs .chip{flex:none}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pe{font-size:30px;width:40px;text-align:center;flex:none}
.prow .pb{flex:1;min-width:0;display:flex;flex-direction:column}
.prow .pb small{color:var(--muted);font-variant-numeric:tabular-nums}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--surface-2);font-size:18px;flex:none}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.field > span{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.emojis button{height:44px;border-radius:10px;font-size:24px;background:var(--surface-2)}
.emojis button[aria-pressed="true"]{outline:3px solid var(--kid)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;color:var(--ink)}
.toggle input{width:24px;height:24px;flex:none}
.hist{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.hd{border-radius:12px;background:var(--surface-2);border:2px solid var(--line);padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-variant-numeric:tabular-nums}
.hd b{font-size:20px}
.hd.on{background:var(--star-soft);border-color:var(--star)}
.ledger{display:flex;flex-direction:column;font-size:14px}
.ledger div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.plus{color:var(--good)} .minus{color:var(--danger)}
.lib h3{margin-top:6px}
.libitems{display:flex;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.pad{grid-template-columns:repeat(3,68px)}.key{height:68px}.stats{grid-template-columns:1fr}}
</style>

<script>
// Suggested task library + default setup (shared by the page and the seed script)
var LIBRARY = [
  { g: 'לפני בית הספר', p: 'morning', items: [
    ['👕','להתלבש',0],['🪥','לצחצח שיניים',2],['🛏️','לסדר את המיטה',0],['🥣','לאכול ארוחת בוקר',0],['🎒','לארוז את התיק',0],['💧','למלא בקבוק מים',0]
  ]},
  { g: 'אחרי בית הספר', p: 'afternoon', items: [
    ['👟','לשים נעליים ותיק במקום',0],['🧼','לשטוף ידיים',0],['🍽️','לאכול ארוחת צהריים',0],['📚','שיעורי בית',20],['📖','לקרוא ספר',15],['🏃','לשחק בחוץ / לזוז',20]
  ]},
  { g: 'עזרה בבית', p: 'afternoon', items: [
    ['🧸','לסדר צעצועים',10],['🍴','לערוך את השולחן',0],['🍽️','להכניס כלים לכיור',0],['🪴','להשקות עציצים',0],['👚','לקפל כביסה',10],['🧺','לשים בגדים מלוכלכים בסל',0],['🗑️','להוציא את הזבל',0]
  ]},
  { g: 'בערב', p: 'afternoon', items: [
    ['🚿','מקלחת ופיג׳מה',0],['🪥','לצחצח שיניים',2],['👕','להכין בגדים למחר',0],['🎒','להכין תיק למחר',0],['📵','לכבות מסכים',0],['😊','לספר לאבא/אמא על היום',5]
  ]},
  { g: 'יום שישי', p: 'afternoon', items: [
    ['🧹','לסדר את החדר לשבת',15],['🕯️','לעזור בהכנות לשבת',0],['🚿','מקלחת לפני שבת',0],['👔','ללבוש בגדי שבת',0]
  ]}
];

function uid() { return Math.random().toString(36).slice(2, 9); }
function mkTask(e, t, p, h, m) { return { id: uid(), e: e, t: t, p: p, h: h || '', m: m || 0 }; }

function defaultDay(d) {
  var chores = [
    ['🧸','לסדר צעצועים',10],['🍴','לערוך את השולחן',0],['🪴','להשקות עציצים',0],['👚','לקפל כביסה',10],['🧺','לשים בגדים מלוכלכים בסל',0]
  ];
  var list = [
    mkTask('👕','להתלבש','morning','07:00',0),
    mkTask('🪥','לצחצח שיניים','morning','',2),
    mkTask('🎒','לארוז את התיק','morning','',0)
  ];
  if (d === 5) {
    list.push(mkTask('🧹','לסדר את החדר לשבת','afternoon','13:00',15));
    list.push(mkTask('🕯️','לעזור בהכנות לשבת','afternoon','',0));
    list.push(mkTask('🚿','מקלחת לפני שבת','afternoon','',0));
    list.push(mkTask('👔','ללבוש בגדי שבת','afternoon','',0));
    return list;
  }
  var c = chores[d];
  list.push(mkTask('👟','לשים נעליים ותיק במקום','afternoon','14:00',0));
  list.push(mkTask('📚','שיעורי בית','afternoon','16:00',20));
  list.push(mkTask(c[0], c[1], 'afternoon', '', c[2]));
  list.push(mkTask('🚿','מקלחת ופיג׳מה','evening','19:00',0));
  list.push(mkTask('🪥','לצחצח שיניים','evening','',2));
  list.push(mkTask('📖','לקרוא ספר','evening','20:00',10));
  return list;
}

// One afternoon/evening period: former 'evening' tasks are flagged ev:1 and kept after the others
var NEW_PINS = { k1: '115', k2: '203', k3: '119' };

function mergeEvening(l) {
  var m = [], a = [], e = [];
  l.forEach(function (x) {
    if (x.p === 'morning') m.push(x);
    else if (x.p === 'evening') { x.p = 'afternoon'; x.ev = 1; e.push(x); }
    else if (x.ev) e.push(x);
    else a.push(x);
  });
  return m.concat(a, e);
}

function defaultSchedule() {
  var s = {};
  for (var d = 0; d <= 5; d++) s[String(d)] = mergeEvening(defaultDay(d));
  s['6'] = [];
  return s;
}

// Fixed morning routine (Sun-Fri) + backpack packed the afternoon before (Sun-Thu)
function applyMorning(sched) {
  for (var d = 0; d <= 5; d++) {
    var l = sched[String(d)]; if (!l) continue;
    var rest = l.filter(function (x) { return x.p !== 'morning' && x.t !== 'לארוז את התיק ליום מחר'; });
    if (d <= 5) {
      var k = rest.length;
      for (var i = 0; i < rest.length; i++) if (rest[i].ev) { k = i; break; }
      rest.splice(k, 0, mkTask('🎒', 'לארוז את התיק ליום מחר', 'afternoon', '', 0));
    }
    sched[String(d)] = [
      mkTask('🚽', 'ללכת לשירותים', 'morning', '', 0),
      mkTask('🚰', 'נטילת ידיים', 'morning', '', 0),

// v7: brush teeth / wash face split, hair (Maayan+Michal), make breakfast + clothes for tomorrow (Maayan)
function applyV7(sched, kid) {
  for (var d = 0; d <= 5; d++) {
    var l = sched[String(d)]; if (!l) continue;
    l = mergeEvening(l);
    function idx(t) { for (var i = 0; i < l.length; i++) if (l[i].t === t) return i; return -1; }
    function lastMorning() { var r = -1; for (var i = 0; i < l.length; i++) if (l[i].p === 'morning') r = i; return r; }
    var ti = idx('לצחצח שיניים ולשטוף פנים');
    if (ti >= 0) l[ti].t = 'לצחצח שיניים';
    ti = idx('לצחצח שיניים');
    if (idx('לשטוף פנים') < 0) l.splice(ti >= 0 ? ti + 1 : lastMorning() + 1, 0, mkTask('🧼', 'לשטוף פנים', 'morning', '', 0));
    if ((kid === 'k1' || kid === 'k3') && idx('לסדר את השיער') < 0) {
      var di = idx('להתלבש');
      l.splice(di >= 0 ? di + 1 : lastMorning() + 1, 0, mkTask('💇‍♀️', 'לסדר את השיער', 'morning', '', 0));
    }
    if (kid === 'k1') {
      if (idx('להכין ארוחת בוקר') < 0) {
        var bi = idx('לאכול ארוחת בוקר');
        l.splice(bi >= 0 ? bi : lastMorning() + 1, 0, mkTask('🍳', 'להכין ארוחת בוקר', 'morning', '', 0));
      }
      if (idx('להכין בגדים למחר') < 0) {
        var pi = idx('לארוז את התיק ליום מחר'), at = pi >= 0 ? pi + 1 : l.length;

      }
    }
    sched[String(d)] = l;
  }
  return sched;
}

// Extra per-child tasks. Days: 0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
function addExtras(sched, kid) {
  function place(list, task, where) {
    if (list.some(function (x) { return x.t === task.t; })) return;
    var i = list.length;
    if (where === 'afterDress') i = 1;
    else if (where === 'afterFirstAfternoon') {
      for (var j = 0; j < list.length; j++) if (list[j].p === 'afternoon') { i = j + 1; break; }
    } else {
      for (var k = 0; k < list.length; k++) if (list[k].ev) { i = k; break; }
    }
    list.splice(i, 0, task);
  }
  for (var d = 0; d <= 5; d++) {
    var l = sched[String(d)];
    if (kid === 'k1') place(l, mkTask('🍽️', 'לאכול ארוחת צהריים', 'afternoon', '', 0), 'afterFirstAfternoon');

    [2, 4].forEach(function (d) { place(sched[String(d)], mkTask('🗑️', 'להוציא את הזבל', 'afternoon', '', 0), 'beforeEvening'); });

  }
  return applyV7(applyMorning(sched), kid);
}

function stk(e){return STK_IMG[e]?'<img src="'+STK_IMG[e]+'" alt="" style="width:1.1em;height:1.1em;border-radius:22%;vertical-align:middle">':e;}
var STICKERS_GAME=['img0','img1','🍄','⭐','🪙','🏰','🐢','🎮','💎','💥','🏆','⚡','🕹️','🔥','👾','🚀','🎯','🛡️','💣','🌟','🎲','🧨'];
function stickerFor(kid,n){var s=(kid&&kid.id==='k2')?STICKERS_GAME:(kid&&kid.id==='k1')?STICKERS_GIRL:STICKERS;return s[n%s.length];}
function dayVal(){return +cfg.dayValue||1;}
function awardDay(p,tk,kid){p.ledger=p.ledger||[];p.stickers=p.stickers||[];
  if(!p.ledger.some(function(e){return e.day===tk;}))p.ledger.push({id:uid(),d:tk,a:dayVal(),n:'יום מלא',day:tk});
  if(!p.stickers.some(function(x){return x.d===tk&&!x.s;}))p.stickers.push({d:tk,e:stickerFor(kid,p.stickers.length)});}
function revokeDay(p,tk){if(p.complete)delete p.complete[tk];p.ledger=(p.ledger||[]).filter(function(e){return e.day!==tk;});p.stickers=(p.stickers||[]).filter(function(x){return x.d!==tk;});}
var reconTimer=null;
function reconcileAll(){if(!cfg||!cfg.kids)return;var now=new Date(),tk=dkey(now),dow=now.getDay();
  cfg.kids.forEach(function(k){var p=prog[k.id];if(!p)return;var tasks=tasksFor(k.id,dow);if(!tasks.length)return;
    var dn=(p.done||{})[tk]||[];var all=tasks.every(function(t){return dn.indexOf(t.id)>=0;});var c=!!(p.complete&&p.complete[tk]);
    if(c&&!all){var q=clone(p);revokeDay(q,tk);saveProg(k.id,q);}
    else if(!c&&all&&dn.length){var q2=clone(p);q2.complete=q2.complete||{};q2.complete[tk]=true;awardDay(q2,tk,k);saveProg(k.id,q2);}});}
function daysDone(p){var n=0;for(var k in (p.complete||{}))if(p.complete[k])n++;return n;}
function streakOf(p){var d=new Date();d.setHours(12,0,0,0);var c=p.complete||{};if(!c[dkey(d)])d=addDays(d,-1);var n=0;for(var i=0;i<40;i++){if(d.getDay()===6){d=addDays(d,-1);continue;}if(c[dkey(d)]){n++;d=addDays(d,-1);}else break;}return n;}
function accHtml(p){var c=daysDone(p);return (c>=1?'<i class="acc a1">'+(c>=6?'👑':'🎩')+'</i>':'')+(c>=3?'<i class="acc a2">🕶️</i>':'')+(c>=10?'<i class="acc a3">🎀</i>':'');}
function collHtml(p){var s=p.stickers||[],c=daysDone(p),nx=ACC.filter(function(x){return x>c;})[0];var g=s.map(function(x){return '<span>'+stk(x.e)+'</span>';}).join('')+'<span class="lock">❔</span><span class="lock">❔</span><span class="lock">❔</span>';return '<div class="card coll"><h3>🌟 האוסף שלי ('+s.length+')</h3><div class="sg">'+g+'</div><div class="lbl">'+(nx?'עוד '+(nx-c)+' ימים מלאים לאביזר חדש לחבר שלי':'יש לי את כל האביזרים! 👑')+'</div></div>';}
function mascotOf(kid){var m=MASCOTS[kid.mascot]||MASCOTS.dragon;return m.s[dayStage(kid)];}
function weekPoints(p,ws){var n=0;for(var i=0;i<6;i++)if(p.complete&&p.complete[dkey(addDays(ws,i))])n++;return n;}
function mins(h){if(!h)return null;var a=h.split(':');return (+a[0])*60+(+a[1]);}
function nowMins(){var n=new Date();return n.getHours()*60+n.getMinutes();}
function reminderFor(k){var n=nowMins(),w=mins(k.wake),s=mins(k.sleep);
  if(w!=null&&n>=w&&n<w+60)return {type:'wake',text:'☀️ בוקר טוב! זמן לקום ולהתחיל את היום'};
  if(s!=null&&n>=s-45&&n<s)return {type:'soon',text:'🌙 עוד '+(s-n)+' דקות שעת שינה. זמן לסיים את משימות הערב'};
  if(s!=null&&(n>=s||(n<5*60)))return {type:'sleep',text:'😴 שעת שינה! לילה טוב'};
  return null;}
function setKidColor(kid){var c=kid&&kid.color||'#2E86C1';document.documentElement.style.setProperty('--kid',c);document.documentElement.style.setProperty('--kid-soft','color-mix(in srgb, '+c+' 16%, var(--surface))');}

/* ---------- storage ---------- */
function lsGet(path){try{var v=localStorage.getItem('kv:'+path);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(path,data){
  if(!db){try{localStorage.setItem('kv:'+path,JSON.stringify(data));}catch(e){} return;}
  var q=queue[path]||(queue[path]={busy:false,next:null});
  q.next=data; if(q.busy) return;
  q.busy=true;
  (async function(){
    while(q.next){var d=q.next;q.next=null;
      try{await db.doc(path).set(d);}catch(e){
        if(e&&e.code==='unavailable'){await sleep(700+Math.random()*900);try{await db.doc(path).set(d);}catch(e2){toast('השמירה נכשלה. נסו שוב בעוד רגע.');}}
        else if(e&&e.code==='invalid_argument'){toast('אין הרשאה לשמור כאן.');}
        else toast('השמירה נכשלה. נסו שוב.');
      }}
    q.busy=false;
  })();
}
function saveCfg(c){cfg=c;save('app/config',c);}
function saveProg(id,p){prog[id]=p;save('progress/'+id,p);}
function busy(path){var q=queue[path];return q&&(q.busy||q.next);}
function scheduleRender(){var a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&$app.contains(a)){pendingRender=true;return;}if(!$ov.hidden&&view.modalLock)return;render();}

/* ---------- sound ---------- */
var actx=null;
function tone(freqs,dur,gap){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var t=actx.currentTime;freqs.forEach(function(f,i){var o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+i*gap);g.gain.exponentialRampToValueAtTime(0.18,t+i*gap+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*gap+dur);o.connect(g).connect(actx.destination);o.start(t+i*gap);o.stop(t+i*gap+dur+0.05);});}catch(e){}}
function sfx(kind,kid){if(!kid||kid.sound===false)return;if(kind==='task')tone([660,880],0.25,0.1);else if(kind==='day')tone([523,659,784,1047],0.35,0.13);else if(kind==='week')tone([523,659,784,1047,1319,1568],0.4,0.12);else if(kind==='timer')tone([880,660,880,660],0.3,0.3);else if(kind==='tap')tone([440],0.08,0);}

/* ---------- confetti ---------- */
var fx=document.getElementById('fx'),fctx=fx.getContext('2d'),parts=[],fxOn=false;
var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n,calm){if(reduced)return;var W=fx.width=innerWidth*devicePixelRatio,H=fx.height=innerHeight*devicePixelRatio;var cols=['#F2B21B','#2E86C1','#1D9A67','#D9467A','#8E5BD0','#E07B28'];for(var i=0;i<n;i++){parts.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.45,vx:(Math.random()-.5)*(calm?6:16)*devicePixelRatio,vy:(-Math.random()*(calm?8:18)-4)*devicePixelRatio,r:(4+Math.random()*6)*devicePixelRatio,c:cols[i%cols.length],a:Math.random()*6,life:0,star:calm||Math.random()<.3});}if(!fxOn){fxOn=true;requestAnimationFrame(step);}}
function step(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(function(p){return p.life<160&&p.y<fx.height+40;});parts.forEach(function(p){p.life++;p.vy+=0.35*devicePixelRatio;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.a+=0.1;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.globalAlpha=Math.max(0,1-p.life/160);fctx.fillStyle=p.c;if(p.star){fctx.beginPath();for(var i=0;i<5;i++){var an=i*Math.PI*2/5-Math.PI/2;fctx.lineTo(Math.cos(an)*p.r,Math.sin(an)*p.r);var an2=an+Math.PI/5;fctx.lineTo(Math.cos(an2)*p.r*.45,Math.sin(an2)*p.r*.45);}fctx.fill();}else fctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);fctx.restore();});if(parts.length)requestAnimationFrame(step);else{fxOn=false;fctx.clearRect(0,0,fx.width,fx.height);}}
function praise(text){var el=document.createElement('div');el.className='praise';el.dir='rtl';el.textContent=text;document.body.appendChild(el);setTimeout(function(){el.remove();},1400);}
function toast(t){var el=document.createElement('div');el.className='toast';el.dir='rtl';el.setAttribute('role','status');el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove();},2600);}

function toggleTask(id){
  var k=kidById(view.kidId);if(!k)return;
  var now=new Date(),tk=dkey(now),ws=weekStart(now),wk=dkey(ws);
  var p=clone(P(k.id));p.done=p.done||{};p.complete=p.complete||{};p.ledger=p.ledger||[];
  var list=p.done[tk]||[];var tasks=tasksFor(k.id,now.getDay());

  var i=list.indexOf(id);
  if(i>=0){list.splice(i,1);p.done[tk]=list;var lost=!!p.complete[tk];if(lost)revokeDay(p,tk);saveProg(k.id,p);render();if(lost)toast('הכוכב והשקל של היום חוזרים כשתסיים הכול שוב');return;}
  list.push(id);p.done[tk]=list;

  if(allDone&&!p.complete[tk]){p.complete[tk]=true;kind='day';awardDay(p,tk,k);var stk=streakOf(p);if(stk>=3&&stk%3===0)p.stickers.push({d:tk,e:(k.id==='k1'?SURPRISE_GIRL:SURPRISE)[(stk/3-1)%SURPRISE.length],s:1});}

function celebrate(kind,k,newLv,p){

  var m=MASCOTS[k.mascot]||MASCOTS.dragon;
  var lvLine=newLv>=0?'<p>ה'+m.n+' שלך גדל! '+m.s[newLv-1]+' ← '+m.s[newLv]+'</p>':'';

  else if(kind==='day') body='<div class="big">⭐</div><h1>סיימת את היום!</h1><p>קיבלת '+dayVal()+' ₪! סה״כ: '+balance(p)+' ₪</p>';
  else body='<div class="big">'+m.s[newLv]+'</div><h1>'+PRAISE[0]+'</h1>';
  if(kind!=='task'){var tkn=dkey(new Date()),ns=(p.stickers||[]).filter(function(x){return x.d===tkn;});if(ns.length)body+='<p style="font-size:34px">'+ns.map(function(x){return stk(x.e);}).join(' ')+'</p><p>קיבלת '+(ns.length>1?'פתאום גם הפתעה! 🔥 '+streakOf(p)+' ימים ברצף':'מדבקה חדשה לאוסף')+'</p>';}

var tm=null,wake=null;
function startTimer(id){
  var k=kidById(view.kidId);var t=tasksFor(k.id,new Date().getDay()).find(function(x){return x.id===id;});if(!t)return;
  tm={id:id,total:t.m*60,left:t.m*60,run:true,last:Date.now(),iv:null,task:t};
  openModal('<div class="timer"><h2>'+esc(t.t)+'</h2><div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--surface-2)" stroke-width="18"/><circle id="arc" cx="100" cy="100" r="88" fill="none" stroke="var(--kid)" stroke-width="18" stroke-linecap="round" stroke-dasharray="552.9" stroke-dashoffset="0"/></svg><div class="tc"><span class="te">'+esc(t.e)+'</span><span class="tt" id="tt"></span></div></div><div class="row" id="tbtns"><button class="btn primary" data-act="tpause" id="tp">⏸ עצירה</button><button class="btn" data-act="close">סגירה</button></div></div>','center',true);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){});}catch(e){}
  tm.iv=setInterval(tick,250);tick();
}
function tick(){if(!tm)return;var n=Date.now();if(tm.run){tm.left-=(n-tm.last)/1000;}tm.last=n;if(tm.left<=0){tm.left=0;}
  var tt=document.getElementById('tt'),arc=document.getElementById('arc');if(!tt){stopTimer();return;}
  var s=Math.ceil(tm.left);tt.textContent=Math.floor(s/60)+':'+pad(s%60);arc.setAttribute('stroke-dashoffset',String(552.9*(1-tm.left/tm.total)));
  if(tm.left<=0&&tm.run){tm.run=false;var k=kidById(view.kidId);sfx('timer',k);confetti(k&&k.calm?15:50,k&&k.calm);
    document.getElementById('tbtns').innerHTML='<button class="btn good" data-act="tdone">✓ סיימתי! לסמן</button><button class="btn" data-act="close">סגירה</button>';tt.textContent='נגמר!';}}
function stopTimer(){if(tm){clearInterval(tm.iv);tm=null;}if(wake){try{wake.release();}catch(e){}wake=null;}}

  var off=view.wo||0;var ws=addDays(weekStart(new Date()),off*7);var wk=dkey(ws);
  var h='<div class="row spread"><button class="btn small" data-act="wk" data-o="-1">→ שבוע קודם</button><b>'+fmtD(ws)+' – '+fmtD(addDays(ws,5))+'</b><button class="btn small" data-act="wk" data-o="1"'+(off>=0?' disabled style="opacity:.4"':'')+'>שבוע הבא ←</button></div><p class="muted">הקשה על יום מסמנת או מבטלת כוכב ידנית. הפרצוף מתחת לכל יום מראה איך הילד/ה הרגיש/ה.</p>';
  cfg.kids.forEach(function(k){var p=P(k.id);var pts=weekPoints(p,ws);var got=(p.ledger||[]).some(function(e){return e.w===wk;});
    h+='<div class="card"><div class="row spread"><h3>'+esc(k.name)+'</h3><span>⭐ '+pts+' ימים'+'</span></div><div class="hist">';
    for(var i=0;i<6;i++){var d=addDays(ws,i),key=dkey(d);var tot=tasksFor(k.id,i).length;var dn=(p.done[key]||[]).length;var on=p.complete&&p.complete[key];
      h+='<button class="hd'+(on?' on':'')+'" data-act="hday" data-id="'+k.id+'" data-k="'+key+'"><span>'+DSH[i]+'</span><b>'+(on?'⭐':'·')+'</b><span>'+Math.min(dn,tot)+'/'+tot+'</span><span style="font-size:18px">'+((p.mood&&p.mood[key])||'&nbsp;')+'</span></button>';}
    h+='</div></div>';});
  return h;
}
function pKids(){
  var h=cfg.kids.map(function(k){return '<div class="card" style="--kid:'+k.color+'"><div class="row"><span style="font-size:40px">'+mascotOf(k,totalDone(P(k.id)))+'</span><h3>'+esc(k.name)+'</h3></div><div class="grid2"><label class="field"><span>שם</span><input data-kf="name" data-id="'+k.id+'" id="kn-'+k.id+'" value="'+esc(k.name)+'" maxlength="20"></label><label class="field"><span>קוד (3 ספרות)</span><input data-kf="pin" data-id="'+k.id+'" id="kp-'+k.id+'" value="'+esc(k.pin)+'" inputmode="numeric" maxlength="3" pattern="[0-9]{3}"></label></div><div class="grid2"><label class="field"><span>☀️ שעת קימה</span><input type="time" data-kf="wake" data-id="'+k.id+'" id="kw-'+k.id+'" value="'+esc(k.wake||'')+'"></label><label class="field"><span>🌙 שעת שינה</span><input type="time" data-kf="sleep" data-id="'+k.id+'" id="kz-'+k.id+'" value="'+esc(k.sleep||'')+'"></label></div><div class="field"><span>צבע</span><div class="swatches">'+COLORS.map(function(c){return '<button class="sw" style="background:'+c+'" data-act="kcolor" data-id="'+k.id+'" data-c="'+c+'" aria-pressed="'+(k.color===c)+'" aria-label="צבע"></button>';}).join('')+'</div></div><div class="field"><span>הדמות שגדלה</span><div class="row">'+Object.keys(MASCOTS).map(function(m){return '<button class="chip" data-act="kmascot" data-id="'+k.id+'" data-m="'+m+'" aria-pressed="'+(k.mascot===m)+'">'+MASCOTS[m].s.slice(0,3).join('')+' '+MASCOTS[m].n+'</button>';}).join('')+'</div></div><label class="toggle"><span>🔈 צלילים</span><input type="checkbox" data-kt="sound" data-id="'+k.id+'" id="ks-'+k.id+'"'+(k.sound!==false?' checked':'')+'></label><label class="toggle"><span>🌙 חגיגה רגועה (פחות קונפטי, בלי הבהובים)</span><input type="checkbox" data-kt="calm" data-id="'+k.id+'" id="kc-'+k.id+'"'+(k.calm?' checked':'')+'></label>'+(cfg.kids.length>1?'<button class="btn small danger" data-act="kdel" data-id="'+k.id+'">הסרת הפרופיל</button>':'')+'</div>';}).join('');
  if(cfg.kids.length<4)h+='<button class="btn" data-act="kadd">+ הוספת ילד/ה</button>';
  return h;
}
function pSettings(){
  return '<div class="card"><label class="field"><span>קוד הורה (4 ספרות)</span><input id="s-pin" data-sf="parentPin" value="'+esc(cfg.parentPin)+'" inputmode="numeric" maxlength="4"></label><div class="grid2"><label class="field"><span>ערך שובר למימוש (₪)</span><input id="s-val" data-sf="voucherValue" type="number" min="1" value="'+cfg.voucherValue+'" inputmode="numeric"></label><label class="field"><span>ערך יום מלא (₪)</span><input id="s-day" data-sf="dayValue" type="number" min="1" value="'+(cfg.dayValue||1)+'" inputmode="numeric"></label></div><p class="muted">כל יום שבו כל המשימות סומנו = כוכב ושקל אחד (או הערך שבחרת). אם מסירים סימון ממשימה אחרי שהיום הושלם, הכוכב והכסף של אותו יום נעלמים עד שמשלימים שוב. אפשר להוסיף, להפחית או לאפס כסף בלשונית הכסף.</p></div><div class="card"><h3>איפוס רשימות</h3><p class="muted">מחליף את כל המשימות של כל הילדים ברשימה המוצעת. הכוכבים והשוברים נשמרים.</p><button class="btn danger" data-act="resetlists">איפוס לרשימה המוצעת</button></div>'+(window.STANDALONE?'<div class="card"><h3>📱 חיבור טלפון של ילד/ה</h3><p class="muted">סורקים את הקוד עם המצלמה של הטלפון השני, או שולחים לו את הקישור. אחרי זה מוסיפים למסך הבית. לא לשתף את הקישור עם אנשים אחרים.</p><div id="qr" style="background:#fff;padding:12px;border-radius:12px;align-self:center"></div><input readonly id="joinlink" dir="ltr" value="'+esc(window.STANDALONE.joinLink)+'"><button class="btn" data-sa="copyjoin">העתקת הקישור</button><button class="btn small danger" data-sa="leave">ניתוק הטלפון הזה מהמשפחה</button></div>':'')+(db?'':'<p class="muted">מצב מקומי: הנתונים נשמרים רק במכשיר הזה.</p>');
}

/* ---------- events ---------- */
function onKey(k){
  if(k==='back'){view.pin=view.pin.slice(0,-1);return render();}
  var PL=view.pinFor==='parent'?4:3;if(view.pin.length>=PL)return;view.pin+=k;sfx('tap',kidById(view.pinFor));render();
  if(view.pin.length===PL){
    var ok=view.pinFor==='parent'?view.pin===String(cfg.parentPin):view.pin===String(kidById(view.pinFor).pin);
    setTimeout(function(){
      if(ok){if(view.pinFor==='parent'){view={screen:'parent',tab:'tasks'};}else{view={screen:'kid',kidId:view.pinFor};}render();window.scrollTo(0,0);}
      else{var d=document.getElementById('dots');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');}setTimeout(function(){view.pin='';render();},450);}
    },150);
  }
}
function curTask(id){return (cfg.schedule[view.pk][String(view.pd)]||[]).find(function(t){return t.id===id;});}
function mutateDay(fn){var c=clone(cfg);c.schedule[view.pk]=c.schedule[view.pk]||{};var l=c.schedule[view.pk][String(view.pd)]||[];c.schedule[view.pk][String(view.pd)]=fn(l)||l;saveCfg(c);}
function ledgerAdd(id,a,n){var p=clone(P(id));p.done=p.done||{};p.complete=p.complete||{};p.ledger=p.ledger||[];p.ledger.push({id:uid(),d:dkey(new Date()),a:a,n:n});saveProg(id,p);render();}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'setup': saveCfg(buildDefault()); view={screen:'home'}; render(); break;
    case 'pick': view={screen:'pin',pinFor:id,pin:''}; render(); break;
    case 'pick-parent': if(isInstalled())break; view={screen:'pin',pinFor:'parent',pin:''}; render(); break;
    case 'key': onKey(b.dataset.k); break;
    case 'home': stopTimer(); view={screen:'home'}; render(); break;
    case 'tmv': mutateDay(function(l){var s=sortTasks(l),i=s.findIndex(function(x){return x.id===id;}),j=i+(+b.dataset.dir);if(i<0||j<0||j>=s.length||s[j].p!==s[i].p)return l;var a1=l.indexOf(s[i]),a2=l.indexOf(s[j]),tmp=l[a1];l[a1]=l[a2];l[a2]=tmp;return l;});render(); break;
    case 'toggle': toggleTask(id); break;
    case 'timer': startTimer(id); break;
    case 'tpause': if(tm){tm.run=!tm.run;tm.last=Date.now();b.textContent=tm.run?'⏸ עצירה':'▶️ המשך';} break;
    case 'tdone': var tid=tm&&tm.id;closeModal();if(tid){var p0=P(view.kidId);if((p0.done[dkey(new Date())]||[]).indexOf(tid)<0)toggleTask(tid);} break;
    case 'mascot': var m=document.getElementById('mascot');if(m){var kk=kidById(view.kidId),pp=P(kk.id);m.classList.remove('bounce','spin','wig');void m.offsetWidth;m.classList.add(['bounce','spin','wig'][Math.floor(Math.random()*3)]);if(kk.sound!==false&&!kk.calm)tone([[440,660],[523,784],[392,587,880]][Math.floor(Math.random()*3)],0.2,0.1);if(!kk.calm)confetti(12,true);var bb=document.getElementById('bub');if(bb){bb.textContent=((pp.pet&&pp.pet.name)?pp.pet.name+': ':'')+PET_SAY[Math.floor(Math.random()*PET_SAY.length)];bb.hidden=false;clearTimeout(window._bt);window._bt=setTimeout(function(){bb.hidden=true;},2600);}} break;
    case 'petname': openModal('<h2>איך קוראים לחבר שלי?</h2><input id="petn" maxlength="12" style="font-size:22px;padding:10px;width:100%;text-align:center" value="'+esc((P(view.kidId).pet&&P(view.kidId).pet.name)||'')+'"><button class="btn primary block" data-act="petsave">שמור 💛</button>','center'); break;
    case 'petsave': var ni=document.getElementById('petn'),p2=clone(P(view.kidId));p2.done=p2.done||{};p2.complete=p2.complete||{};p2.ledger=p2.ledger||[];p2.pet={name:(ni&&ni.value||'').trim().slice(0,12)};saveProg(view.kidId,p2);closeModal();render(); break;
    case 'close': closeModal(); break;
    case 'mood': var km=kidById(view.kidId);var pm=clone(P(km.id));pm.done=pm.done||{};pm.complete=pm.complete||{};pm.ledger=pm.ledger||[];pm.mood=pm.mood||{};pm.mood[dkey(new Date())]=b.dataset.m;view.moodEdit=false;saveProg(km.id,pm);sfx('tap',km);render();praise('תודה ששיתפת '+b.dataset.m); break;
    case 'moodedit': view.moodEdit=true; render(); break;
    case 'alarm-off': alarmStop(); closeModal(); break;
    case 'confirm-yes': var f=confirmFn;confirmFn=null;closeModal();if(f)f(); break;
    case 'tab': view.tab=b.dataset.tab; render(); break;
    case 'pk': view.pk=id; render(); break;
    case 'pd': view.pd=+b.dataset.d; render(); break;
    case 'new': editor(null); break;
    case 'edit': editor(curTask(id)); break;
    case 'del': var t=curTask(id);confirmBox('למחוק את "'+(t?t.t:'')+'"?','מחיקה',function(){mutateDay(function(l){return l.filter(function(x){return x.id!==id;});});render();}); break;
    case 'pickemoji': document.getElementById('f-e').value=b.dataset.e;document.querySelectorAll('.emojis button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));}); break;
    case 'lib': libModal(); break;
    case 'libadd': var g=LIBRARY[+b.dataset.g],it=g.items[+b.dataset.i];mutateDay(function(l){l.push(mkTask(it[0],it[1],g.p,'',it[2]));return l;});b.style.opacity='.45';toast('נוסף: '+it[1]); break;
    case 'copy': copyModal(); break;
    case 'docopy':
      var days=[].map.call(document.querySelectorAll('.cp-d:checked'),function(x){return x.value;});
      var kids=[].map.call(document.querySelectorAll('.cp-k:checked'),function(x){return x.value;});
      var src=tasksFor(view.pk,view.pd);var c=clone(cfg);var n=0;
      kids.forEach(function(kid){c.schedule[kid]=c.schedule[kid]||{};days.concat(kid!==view.pk?[String(view.pd)]:[]).forEach(function(d){c.schedule[kid][d]=src.map(function(t){var x=clone(t);x.id=uid();return x;});n++;});});
      saveCfg(c);closeModal();toast('הועתק ל־'+n+' רשימות'); break;
    case 'spend': var pk=P(id);if(balance(pk)<cfg.voucherValue){toast('אין מספיק בשוברים');break;}ledgerAdd(id,-cfg.voucherValue,'שימוש בשובר'); break;
    case 'adj': var v=Math.abs(parseFloat(document.getElementById('amt-'+id).value));if(!v){toast('כתבו סכום');break;}var note=document.getElementById('note-'+id).value.trim();ledgerAdd(id,v*(+b.dataset.sign),note||(b.dataset.sign==='1'?'הוספה ידנית':'הורדה ידנית')); break;
    case 'zero': var bal=balance(P(id));if(!bal){toast('היתרה כבר 0');break;}confirmBox('לאפס את היתרה של '+kidById(id).name+'?','איפוס',function(){ledgerAdd(id,-bal,'איפוס');}); break;
    case 'wk': view.wo=Math.min(0,(view.wo||0)+(+b.dataset.o)); render(); break;
    case 'hday':
      var pp=clone(P(id));pp.done=pp.done||{};pp.complete=pp.complete||{};pp.ledger=pp.ledger||[];var key=b.dataset.k;
      if(pp.complete[key]){revokeDay(pp,key);}else{pp.complete[key]=true;awardDay(pp,key,kidById(id));toast('נוסף '+dayVal()+' ₪');}
      saveProg(id,pp);render(); break;
    case 'kcolor': var c1=clone(cfg);kidOf(c1,id).color=b.dataset.c;saveCfg(c1);render(); break;
    case 'kmascot': var c2=clone(cfg);kidOf(c2,id).mascot=b.dataset.m;saveCfg(c2);render(); break;
    case 'kadd': var c3=clone(cfg);var nid='k'+uid();var first=c3.kids[0];c3.kids.push({id:nid,name:'ילד '+(c3.kids.length+1),pin:String(100+Math.floor(Math.random()*900)),color:COLORS[c3.kids.length%COLORS.length],mascot:'moon',calm:false,sound:true,wake:'06:45',sleep:'20:30'});c3.schedule[nid]=first?clone(c3.schedule[first.id]||defaultSchedule()):defaultSchedule();saveCfg(c3);render();toast('נוסף פרופיל חדש. בדקו את הקוד שלו.'); break;
    case 'kdel': confirmBox('להסיר את '+kidById(id).name+'?','הסרה',function(){var c4=clone(cfg);c4.kids=c4.kids.filter(function(k){return k.id!==id;});delete c4.schedule[id];saveCfg(c4);view.pk=null;render();}); break;
    case 'resetlists': confirmBox('להחליף את כל הרשימות ברשימה המוצעת?','איפוס',function(){var c5=clone(cfg);c5.kids.forEach(function(k){c5.schedule[k.id]=defaultSchedule();});saveCfg(c5);render();}); break;
  }
});
function kidOf(c,id){return c.kids.find(function(k){return k.id===id;});}
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.dataset.kf){var v=el.value.trim();if(el.dataset.kf==='pin'&&!/^\d{3}$/.test(v)){toast('הקוד צריך 3 ספרות');return;}if(!v)return;var c=clone(cfg);kidOf(c,el.dataset.id)[el.dataset.kf]=v;saveCfg(c);toast('נשמר');}
  else if(el.dataset.kt){var c2=clone(cfg);kidOf(c2,el.dataset.id)[el.dataset.kt]=el.checked;saveCfg(c2);}
  else if(el.dataset.sf){var f=el.dataset.sf,val=el.value.trim();var c3=clone(cfg);
    if(f==='parentPin'){if(!/^\d{4}$/.test(val)){toast('הקוד צריך 4 ספרות');return;}c3.parentPin=val;}
    else{var n=parseInt(val,10);if(!(n>=1)){toast('מספר לא תקין');return;}if(f==='pointsNeeded')n=Math.min(6,n);c3[f]=n;}
    saveCfg(c3);toast('נשמר');}
});
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='tform')return;ev.preventDefault();
  var t={e:document.getElementById('f-e').value.trim()||'⭐',t:document.getElementById('f-t').value.trim(),p:document.getElementById('f-p').value,h:document.getElementById('f-h').value,m:Math.max(0,Math.min(120,parseInt(document.getElementById('f-m').value,10)||0))};
  if(!t.t)return;var eid=view.editId;
  mutateDay(function(l){if(eid){var x=l.find(function(y){return y.id===eid;});if(x){x.e=t.e;x.t=t.t;x.p=t.p;x.h=t.h;x.m=t.m;}}else{t.id=uid();l.push(t);}return l;});
  closeModal();
});
$ov.addEventListener('click',function(ev){if(ev.target===$ov&&!tm)closeModal();});
document.addEventListener('keydown',function(ev){if(view.screen==='pin'){if(/^\d$/.test(ev.key))onKey(ev.key);else if(ev.key==='Backspace')onKey('back');}if(ev.key==='Escape'&&!$ov.hidden)closeModal();});

/* idle lock: back to profiles after 5 min without touch */
function resetIdle(){clearTimeout(idleT);idleT=setTimeout(function(){if(view.screen!=='home'&&!tm){if(!$ov.hidden)closeModal();view={screen:'home'};render();}},IDLE_MS);}
['pointerdown','keydown'].forEach(function(e){document.addEventListener(e,resetIdle,{passive:true});});
/* refresh at midnight so a new day shows new tasks */
var lastDay=dkey(new Date());setInterval(function(){var d=dkey(new Date());if(d!==lastDay){lastDay=d;scheduleRender();}},60000);

/* ---------- wake / sleep alarm (while the app is open) ---------- */
var alarmIv=null,fired={};
function alarmStop(){if(alarmIv){clearInterval(alarmIv);alarmIv=null;}}
function checkAlarms(){if(!cfg||!cfg.kids)return;var n=nowMins(),today=dkey(new Date());var hits={wake:[],sleep:[]};
  cfg.kids.forEach(function(k){['wake','sleep'].forEach(function(t){var m=mins(k[t]);var id=today+t+k.id;if(m!=null&&n>=m&&n<m+2&&!fired[id]){fired[id]=true;hits[t].push(k);}});});
  ['wake','sleep'].forEach(function(t){if(!hits[t].length||tm)return;var names=hits[t].map(function(k){return esc(k.name);}).join(', ');
    openModal(t==='wake'?'<div class="big">☀️</div><h1>בוקר טוב '+names+'!</h1><p>זמן לקום. המשימות של היום מחכות לכם.</p><button class="btn primary block" data-act="alarm-off">קמתי! ☀️</button>':'<div class="big">🌙</div><h1>שעת שינה, '+names+'</h1><p>לילה טוב. מחר יום חדש עם כוכבים חדשים ⭐</p><button class="btn primary block" data-act="alarm-off">לילה טוב 🌙</button>','center cele',true);
    alarmStop();var c=0;var play=function(){if(t==='wake')tone([523,659,784,659,523],0.3,0.22);else tone([392,330,262],0.6,0.45);};
    if(hits[t].some(function(k){return k.sound!==false;})){play();alarmIv=setInterval(function(){if(++c>=(t==='wake'?20:2)||$ov.hidden)return alarmStop();play();},4000);}
    if(t==='wake')confetti(40,true);});}
setInterval(checkAlarms,20000);
setInterval(function(){if(view.screen==='home'||view.screen==='kid')scheduleRender();},60000);

/* ---------- one-time migration (v2): add new default tasks + clear test progress ---------- */
var migrated=false;
function migrate(){if(migrated||!cfg||(cfg.v||0)>=10||!cfg.schedule)return;migrated=true;var c=clone(cfg),v0=c.v||0;c.v=10;if(!c.dayValue)c.dayValue=1;
  c.kids.forEach(function(k){if(v0<9&&NEW_PINS[k.id])k.pin=NEW_PINS[k.id];var sc=c.schedule[k.id];if(sc){if(v0<2&&['k1','k2','k3'].indexOf(k.id)>=0)addExtras(sc,k.id);if(v0<4)applyMorning(sc);applyV7(sc,k.id);for(var dd in sc)(sc[dd]||[]).forEach(function(x){if(x.t==='נטילת ידיים')x.e='🚰';});}if(v0<2)saveProg(k.id,{done:{},complete:{},ledger:[]});});
  if(v0<10){c.kids.forEach(function(k){if(k.id==='k1')k.mascot='butterfly';});var p1=clone(P('k1'));if(p1.stickers&&p1.stickers.length){var si=0;p1.stickers.forEach(function(x,i){if(!x.s)x.e=STICKERS_GIRL[i%STICKERS_GIRL.length];else{x.e=SURPRISE_GIRL[si%SURPRISE_GIRL.length];si++;}});saveProg('k1',p1);}}
  saveCfg(c);}
/* ---------- boot ---------- */
if(window.STANDALONE_HOLD)return;
render();
(async function(){
  var c=null;
  if(window.STANDALONE)c=window.STANDALONE.db;
  else{try{c=(window.claude&&window.claude.use)?await window.claude.use('db'):null;}catch(e){c=null;}}
  if(!c){cfg=lsGet('app/config');(cfg&&cfg.kids||[]).forEach(function(k){var p=lsGet('progress/'+k.id);if(p)prog[k.id]=p;});ready=true;render();return;}
  db=c;var gotCfg=false,gotProg=false;
  db.doc('app/config').onSnapshot(function(s){if(busy('app/config'))return;cfg=s.exists?s.data():null;gotCfg=true;if(gotProg){ready=true;migrate();reconcileAll();scheduleRender();}},function(e){toast('בעיה בטעינת הנתונים');});
  db.collection('progress').onSnapshot(function(s){var np={};s.docs.forEach(function(d){np[d.id]=busy('progress/'+d.id)?prog[d.id]:d.data();});for(var k in prog)if(busy('progress/'+k))np[k]=prog[k];prog=np;gotProg=true;if(gotCfg){ready=true;migrate();reconcileAll();scheduleRender();}},function(e){toast('בעיה בטעינת הנתונים');});
})();
})();
</script>
